<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaLoVoice - إعادة التوجيه</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      const pathSegments = window.location.pathname.split('/');
      const repoName = pathSegments[1] || '';
      // Redirect to root index while preserving hash/query
      window.location.replace(
        window.location.origin + (repoName ? '/' + repoName + '/' : '/') + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body style="background-color: #020617; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <p>جارٍ تحميل تطبيق ZaLoVoice...</p>
  </body>
</html>
