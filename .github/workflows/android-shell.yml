name: Android shell validation

on:
  push:
    branches:
      - feat/zalovoice-capacitor-android-shell
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - 'tsconfig.json'
      - '.github/workflows/android-shell.yml'
  pull_request:
    branches:
      - arch/zalovoice-native-speech-runtime-evaluation
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - 'tsconfig.json'
      - '.github/workflows/android-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package is no longer published.
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Neural Core and speech contract tests
        run: npm test
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zalovoice-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
