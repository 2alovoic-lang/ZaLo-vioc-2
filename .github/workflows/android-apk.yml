name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/capacitor-foundation

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and inspect Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          VITE_API_BASE_URL: https://za-lo-vioc-2.vercel.app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Report Android compatibility settings
        run: |
          echo "=== Capacitor Android Gradle configuration ==="
          grep -R -n -E 'minSdkVersion|targetSdkVersion|applicationId|versionCode' android/app/build.gradle android/variables.gradle || true
          echo "=== Android manifest permissions ==="
          grep -o 'android.permission.[A-Z_]*' android/app/src/main/AndroidManifest.xml | sort -u || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Inspect APK package, signing and CPU support
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          echo "=== APK package metadata ==="
          "$AAPT" dump badging "$APK" | head -n 8
          echo "=== APK signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "=== Native CPU libraries included (if any) ==="
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/' || true
          echo "=== APK size ==="
          du -h "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zalovoice-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
